# Builds and publishes the Ability Workshop to GitHub Pages.
#
# PIN: Node only. `Package.swift` has a local path dependency on ../Frigate, so
#      SwiftPM cannot resolve the manifest on a fresh runner, and the package
#      targets macOS 26. The round-trip test gives us the schema guarantee
#      without needing Swift at all — it reads ../Abilities/*.mary directly, so
#      a Swift-side schema change turns this workflow red.

name: Ability Workshop

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Abilities/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'Abilities/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo LFS-tracks ~665 MB of Kokoro voice models. A docs build
          # needs none of them.
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Test
        working-directory: site
        run: npm test

      - name: Build
        working-directory: site
        run: npm run build

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
